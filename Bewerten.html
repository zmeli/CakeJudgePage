<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kuchen bewerten</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap');
  :root { --bg:#EAF0E6; --bg-card:#FBFBF7; --ink:#2B2420; --ink-soft:#6B6055; --plum:#4B2138; --gold:#B8891F; --line:#D8DBCE; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; padding:26px 18px 60px; }
  .wrap { max-width: 520px; margin: 0 auto; }

  header.page { text-align:center; margin-bottom:22px; }
  .eyebrow { font-size:11.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--plum); font-weight:700; margin-bottom:8px; }
  h1 { font-family:'Fraunces',serif; font-weight:600; font-size:30px; margin:0 0 6px; color:var(--plum); line-height:1.15; }
  .flavor { font-size:14px; color:var(--ink-soft); }
  .baker { font-size:12.5px; color:var(--ink-soft); margin-top:4px; }

  .card { background:var(--bg-card); border:1px solid var(--line); border-radius:14px; padding:22px; }
  .feld { margin-bottom:18px; }
  .feld label { display:block; font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .feld input[type=text], .feld textarea {
    width:100%; font-family:'Inter',sans-serif; font-size:16px; padding:11px 12px;
    border:1.5px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);
  }
  .feld textarea { resize:vertical; min-height:56px; }
  .feld input:focus, .feld textarea:focus { outline:2px solid var(--gold); outline-offset:1px; }

  .slider { margin-bottom:20px; }
  .slider label { display:flex; justify-content:space-between; align-items:baseline; font-size:14px; font-weight:600; color:var(--ink); }
  .slider label b { font-family:'Fraunces',serif; font-size:20px; color:var(--plum); }
  .slider input[type=range] { width:100%; accent-color:var(--plum); height:28px; }
  .hint { font-size:11.5px; color:var(--ink-soft); display:flex; justify-content:space-between; }

  .btn { width:100%; background:var(--plum); color:#fff; border:none; padding:15px; border-radius:999px; font-family:'Inter',sans-serif; font-size:16px; font-weight:600; cursor:pointer; }
  .btn:hover { background:#3a1929; }
  .btn:disabled { opacity:.6; cursor:default; }

  .msg { text-align:center; padding:40px 20px; line-height:1.6; font-size:14px; color:var(--ink-soft); }
  .msg b { display:block; font-family:'Fraunces',serif; font-size:22px; color:var(--plum); margin-bottom:10px; font-weight:600; }
  .fehler { background:#F3DEDE; color:#8A3A3A; border-radius:10px; padding:12px 16px; font-size:13px; text-align:center; margin-bottom:18px; line-height:1.5; }
  .laden { text-align:center; color:var(--ink-soft); font-size:13px; padding:40px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="inhalt"><div class="laden">Kuchen wird geladen &hellip;</div></div>
</div>

<script>
// ======= HIER DIESELBE URL WIE AUF DER HAUPTSEITE EINTRAGEN =======
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbywBvQJrxYYN8ukdUPKcuR1VB_3-nWFWdTyFwfyQPD_SKXI1nkPBUhPgwTjrKZzlpkd/exec';
// ==================================================================

const SCALE_MAX = 7;
const KRITERIEN = [
  { key:'taste',        label:'Geschmack',      low:'Vergessenswert', high:'Unglaublich' },
  { key:'sweetness',    label:'S\u00fc\u00dfe-Balance', low:'Unausgewogen', high:'Genau richtig' },
  { key:'heaviness',    label:'F\u00fcllig',    low:'Federleicht',    high:'Sehr f\u00fcllig' },
  { key:'texture',      label:'Textur',         low:'Daneben',        high:'Perfekt' },
  { key:'appearance',   label:'Optik',          low:'Schlicht',       high:'Hingucker' },
  { key:'crowdPleaser', label:'Gef\u00e4llt allen', low:'Speziell',   high:'Alle lieben ihn' }
];

const inhalt = document.getElementById('inhalt');
const kuchenId = new URLSearchParams(location.search).get('id');

function esc(s){ const d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }

function postToSheet(payload) {
  return new Promise(function (resolve, reject) {
    const frameName = 'f_' + Date.now();
    const iframe = document.createElement('iframe');
    iframe.name = frameName; iframe.style.display = 'none';
    document.body.appendChild(iframe);
    const form = document.createElement('form');
    form.method='POST'; form.action=APPS_SCRIPT_URL; form.target=frameName; form.style.display='none';
    const input = document.createElement('input');
    input.type='hidden'; input.name='payload'; input.value=JSON.stringify(payload);
    form.appendChild(input); document.body.appendChild(form);
    let fertig = false;
    function aufraeumen(){
      if (form.parentNode) form.parentNode.removeChild(form);
      setTimeout(function(){ if (iframe.parentNode) iframe.parentNode.removeChild(iframe); }, 500);
    }
    iframe.addEventListener('load', function(){ if(fertig) return; fertig=true; aufraeumen(); resolve(); });
    setTimeout(function(){ if(fertig) return; fertig=true; aufraeumen(); reject(new Error('Zeit\u00fcberschreitung.')); }, 20000);
    form.submit();
  });
}

function formular(kuchen) {
  const sliders = KRITERIEN.map(function (c) {
    return '<div class="slider">' +
      '<label for="s_' + c.key + '">' + c.label + ' <b id="v_' + c.key + '">4</b></label>' +
      '<input type="range" min="0" max="' + SCALE_MAX + '" value="4" id="s_' + c.key + '" />' +
      '<div class="hint"><span>' + c.low + '</span><span>' + c.high + '</span></div>' +
    '</div>';
  }).join('');

  inhalt.innerHTML =
    '<header class="page">' +
      '<div class="eyebrow">Cake Trials</div>' +
      '<h1>' + esc(kuchen.name) + '</h1>' +
      (kuchen.flavor ? '<div class="flavor">' + esc(kuchen.flavor) + '</div>' : '') +
      (kuchen.baker ? '<div class="baker">' + esc(kuchen.baker) + '</div>' : '') +
    '</header>' +
    '<div id="fehler"></div>' +
    '<div class="card">' +
      '<div class="feld"><label for="fName">Dein Name</label>' +
      '<input type="text" id="fName" placeholder="Damit wir wissen, wer das war" autocomplete="name" /></div>' +
      sliders +
      '<div class="feld"><label for="fNotiz">Kurze Anmerkung</label>' +
      '<textarea id="fNotiz" placeholder="Optional \u2013 was ist dir aufgefallen?"></textarea></div>' +
      '<button class="btn" id="sendBtn">Bewertung abschicken</button>' +
    '</div>';

  KRITERIEN.forEach(function (c) {
    const el = document.getElementById('s_' + c.key);
    const out = document.getElementById('v_' + c.key);
    el.addEventListener('input', function(){ out.textContent = el.value; });
  });

  document.getElementById('sendBtn').addEventListener('click', function(){ senden(kuchen); });
}

async function senden(kuchen) {
  const btn = document.getElementById('sendBtn');
  const name = document.getElementById('fName').value.trim();
  const fehler = document.getElementById('fehler');
  if (!name) {
    fehler.innerHTML = '<div class="fehler">Bitte trag deinen Namen ein \u2013 sonst wissen wir nicht, wessen Geschmack das war.</div>';
    document.getElementById('fName').focus();
    return;
  }
  fehler.innerHTML = '';
  btn.disabled = true; btn.textContent = 'Wird gesendet \u2026';

  const daten = {
    action: 'rate',
    id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()),
    kuchenId: kuchen.id,
    wer: name,
    notiz: document.getElementById('fNotiz').value.trim()
  };
  KRITERIEN.forEach(function (c) { daten[c.key] = Number(document.getElementById('s_' + c.key).value); });

  try {
    await postToSheet(daten);
    inhalt.innerHTML = '<div class="msg"><b>Danke, ' + esc(name) + '!</b>' +
      'Deine Bewertung von <strong>' + esc(kuchen.name) + '</strong> ist eingegangen und flie\u00dft ab sofort in die Gesamtwertung ein.' +
      '<div style="margin-top:22px;"><button class="btn" onclick="location.reload()">Nochmal bewerten</button></div></div>';
  } catch (e) {
    fehler.innerHTML = '<div class="fehler">Das hat leider nicht geklappt. Bitte pr\u00fcf die Verbindung und versuch es nochmal.</div>';
    btn.disabled = false; btn.textContent = 'Bewertung abschicken';
  }
}

(async function init(){
  if (APPS_SCRIPT_URL.indexOf('PASTE_YOUR') !== -1) {
    inhalt.innerHTML = '<div class="msg"><b>Noch nicht verbunden.</b>Trage im &lt;script&gt;-Tag dieselbe Apps-Script-URL ein wie auf der Hauptseite.</div>';
    return;
  }
  if (!kuchenId) {
    inhalt.innerHTML = '<div class="msg"><b>Kein Kuchen ausgew\u00e4hlt.</b>Dieser Link geh\u00f6rt zu einem bestimmten Kuchen. Scann den QR-Code noch einmal.</div>';
    return;
  }
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?kuchen=' + encodeURIComponent(kuchenId));
    const k = await res.json();
    if (!k || !k.gefunden) {
      inhalt.innerHTML = '<div class="msg"><b>Kuchen nicht gefunden.</b>Vielleicht wurde er inzwischen aus der Liste entfernt.</div>';
      return;
    }
    formular(k);
  } catch (e) {
    inhalt.innerHTML = '<div class="msg"><b>Verbindung fehlgeschlagen.</b>Der Kuchen konnte nicht geladen werden. Bitte sp\u00e4ter nochmal versuchen.</div>';
  }
})();
</script>
</body>
</html>
