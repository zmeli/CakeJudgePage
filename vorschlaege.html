<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cake Trials &ndash; Vorschl&auml;ge</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --bg: #EAF0E6; --bg-card: #FBFBF7; --ink: #2B2420; --ink-soft: #6B6055;
    --plum: #4B2138; --gold: #B8891F; --line: #D8DBCE; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; padding:32px 18px 80px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  a.back { color: var(--ink-soft); font-size: 13px; text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 18px; }
  a.back:hover { color: var(--plum); }

  header.page { text-align: center; margin-bottom: 24px; }
  .eyebrow { font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--plum); font-weight:600; margin-bottom:8px; }
  h1 { font-family:'Fraunces',serif; font-weight:600; font-size:40px; margin:0 0 10px; color:var(--plum); letter-spacing:-.01em; }
  .sub { color:var(--ink-soft); font-size:15px; max-width:500px; margin:0 auto; line-height:1.55; }

  button { font-family:'Inter',sans-serif; cursor:pointer; border:none; }
  .btn-primary { background:var(--plum); color:#fff; padding:12px 22px; border-radius:999px; font-size:14px; font-weight:600; transition:transform .15s ease, background .15s ease; }
  .btn-primary:hover { background:#3a1929; transform:translateY(-1px); }
  .btn-primary:disabled { opacity:.6; cursor:default; transform:none; }
  .btn-ghost { background:transparent; color:var(--plum); padding:12px 18px; border-radius:999px; font-size:14px; font-weight:600; border:1.5px solid var(--plum); }
  .btn-ghost:hover { background:rgba(75,33,56,.06); }
  .toolbar { display:flex; gap:10px; justify-content:center; margin:24px 0 14px; flex-wrap:wrap; }

  .lock-row { display:flex; justify-content:center; margin-bottom:14px; }
  .lock-panel { background:var(--bg-card); border:1.5px solid var(--line); border-radius:14px; padding:16px 18px; max-width:420px; width:100%; text-align:center; display:none; }
  .lock-panel.open { display:block; }
  .lock-panel p { margin:0 0 10px; font-size:13px; color:var(--ink-soft); line-height:1.5; }
  .lock-inputs { display:flex; gap:8px; }
  .lock-inputs input { flex:1; font-family:'Inter',sans-serif; font-size:15px; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  .lock-inputs input:focus { outline:2px solid var(--gold); outline-offset:1px; }
  .lock-err { color:#8A3A3A; font-size:12.5px; margin-top:8px; min-height:16px; }

  .form-card { background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:24px; margin-bottom:28px; display:none; }
  .form-card.open { display:block; }
  .form-card h2 { font-family:'Fraunces',serif; font-size:21px; margin:0 0 16px; color:var(--plum); }
  .field { margin-bottom:15px; }
  .field label { display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .field input, .field textarea { width:100%; font-family:'Inter',sans-serif; font-size:15px; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  .field textarea { resize:vertical; min-height:70px; }
  .field input:focus, .field textarea:focus { outline:2px solid var(--gold); outline-offset:1px; }
  .form-actions { display:flex; gap:10px; margin-top:6px; }

  .v-card { background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:14px; }
  .v-titel { font-family:'Fraunces',serif; font-size:19px; font-weight:600; margin:0; color:var(--ink); line-height:1.2; }
  .v-meta { font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .v-notizen { font-size:13.5px; line-height:1.55; margin-top:10px; white-space:pre-wrap; }
  .v-link { display:inline-block; margin-top:10px; font-size:13px; color:var(--plum); font-weight:600; word-break:break-all; }
  .v-link:hover { color:var(--gold); }
  .v-actions { margin-top:12px; }
  .mini-btn { background:none; color:var(--ink-soft); font-size:12px; padding:5px 10px; border-radius:6px; border:1px solid var(--line); font-weight:600; }
  .mini-btn.danger:hover { color:#a83232; border-color:#a83232; }

  .empty { text-align:center; padding:44px 20px; color:var(--ink-soft); font-size:14px; }
  .empty .big { font-family:'Fraunces',serif; font-style:italic; font-size:20px; color:var(--plum); display:block; margin-bottom:8px; }
  .loading { text-align:center; color:var(--ink-soft); font-size:13px; padding:30px; }
  .error-banner { background:#F3DEDE; color:#8A3A3A; border-radius:10px; padding:12px 16px; font-size:13px; text-align:center; margin-bottom:20px; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; Zur&uuml;ck zur Liste</a>

  <header class="page">
    <div class="eyebrow">Die Warteliste</div>
    <h1>Vorschl&auml;ge</h1>
    <p class="sub">Kuchen, die noch niemand probiert hat, aber jemand unbedingt probieren m&ouml;chte. Mit Rezeptlink, falls vorhanden.</p>
  </header>

  <div id="errorBanner"></div>

  <div class="toolbar">
    <button class="btn-primary" id="toggleFormBtn">Vorschlag hinzuf&uuml;gen</button>
    <button class="btn-ghost" id="lockBtn">&#128274; Freischalten</button>
  </div>

  <div class="lock-row">
    <div class="lock-panel" id="lockPanel">
      <p>Lesen darf jeder. Zum Vorschlagen brauchst du Namen und Kennwort.</p>
      <div class="lock-inputs" style="margin-bottom:8px;">
        <input type="text" id="nameInput" placeholder="Dein Name" autocomplete="name" />
      </div>
      <div class="lock-inputs">
        <input type="password" id="pwInput" placeholder="Kennwort" autocomplete="current-password" />
        <button class="btn-primary" id="pwSubmit">Freischalten</button>
      </div>
      <div class="lock-err" id="pwErr"></div>
    </div>
  </div>

  <div class="form-card" id="formCard">
    <h2>Neuer Vorschlag</h2>
    <div class="field">
      <label for="fTitel">Titel</label>
      <input type="text" id="fTitel" placeholder="z.B. Pistazien-Rosenwasser-Torte" />
    </div>
    <div class="field">
      <label for="fNotizen">Notizen</label>
      <textarea id="fNotizen" placeholder="Warum dieser Kuchen? Was ist das Besondere? Worauf m&uuml;sste man achten?"></textarea>
    </div>
    <div class="field">
      <label for="fLink">Link zum Rezept</label>
      <input type="text" id="fLink" placeholder="https://..." />
    </div>
    <div class="form-actions">
      <button class="btn-primary" id="saveBtn">Speichern</button>
      <button class="btn-ghost" id="cancelBtn">Abbrechen</button>
    </div>
  </div>

  <div id="listArea"><div class="loading">Vorschl&auml;ge werden geladen &hellip;</div></div>
</div>

<script>
// ======= HIER DIESELBE URL WIE AUF DER HAUPTSEITE EINTRAGEN =======
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbywBvQJrxYYN8ukdUPKcuR1VB_3-nWFWdTyFwfyQPD_SKXI1nkPBUhPgwTjrKZzlpkd/exec';
// ==================================================================

let vorschlaege = [];
let unlocked = false;
let passwort = '';
let bearbeiterName = '';

const listArea = document.getElementById('listArea');
const errorBanner = document.getElementById('errorBanner');
const formCard = document.getElementById('formCard');
const saveBtn = document.getElementById('saveBtn');
const cancelBtn = document.getElementById('cancelBtn');
const toggleFormBtn = document.getElementById('toggleFormBtn');
const lockBtn = document.getElementById('lockBtn');
const lockPanel = document.getElementById('lockPanel');
const pwInput = document.getElementById('pwInput');
const nameInput = document.getElementById('nameInput');
const pwSubmit = document.getElementById('pwSubmit');
const pwErr = document.getElementById('pwErr');

function escapeHtml(str) { const d = document.createElement('div'); d.textContent = (str == null ? '' : String(str)); return d.innerHTML; }
function showError(m) { errorBanner.innerHTML = '<div class="error-banner">' + m + '</div>'; }
function showInfo(m) { errorBanner.innerHTML = '<div class="error-banner" style="background:#E4EEDF; color:#4A6B41;">' + m + '</div>'; }
function clearBanner() { errorBanner.innerHTML = ''; }

function datumKurz(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso).slice(0, 16);
  return d.toLocaleString('de-AT', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function postToSheet(payload) {
  return new Promise(function (resolve, reject) {
    const frameName = 'sheetFrame_' + Date.now();
    const iframe = document.createElement('iframe');
    iframe.name = frameName; iframe.style.display = 'none';
    document.body.appendChild(iframe);
    const form = document.createElement('form');
    form.method = 'POST'; form.action = APPS_SCRIPT_URL; form.target = frameName; form.style.display = 'none';
    const input = document.createElement('input');
    input.type = 'hidden'; input.name = 'payload';
    input.value = JSON.stringify(Object.assign({ pw: passwort, bearbeiter: bearbeiterName }, payload));
    form.appendChild(input); document.body.appendChild(form);
    let settled = false;
    function cleanup() {
      if (form.parentNode) form.parentNode.removeChild(form);
      setTimeout(function () { if (iframe.parentNode) iframe.parentNode.removeChild(iframe); }, 500);
    }
    iframe.addEventListener('load', function () { if (settled) return; settled = true; cleanup(); resolve(); });
    setTimeout(function () { if (settled) return; settled = true; cleanup(); reject(new Error('Zeit\u00fcberschreitung.')); }, 20000);
    form.submit();
  });
}

async function laden() {
  if (APPS_SCRIPT_URL.indexOf('PASTE_YOUR') !== -1) {
    listArea.innerHTML = '';
    showError('Diese Seite ist noch nicht verbunden. Trage oben im &lt;script&gt;-Tag dieselbe Apps-Script-URL ein wie auf der Hauptseite.');
    return;
  }
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?vorschlaege=1');
    const data = await res.json();
    vorschlaege = Array.isArray(data) ? data : [];
    clearBanner();
  } catch (e) {
    vorschlaege = [];
    showError('Vorschl\u00e4ge konnten nicht geladen werden. Pr\u00fcfe die Apps-Script-URL.');
  }
}

function render() {
  if (!vorschlaege.length) {
    listArea.innerHTML = '<div class="empty"><span class="big">Noch keine Vorschl\u00e4ge.</span>' +
      'Der erste gute Einfall geh\u00f6rt dir.</div>';
    return;
  }
  const sortiert = vorschlaege.slice().sort(function (a, b) {
    return String(b.zeitstempel) < String(a.zeitstempel) ? -1 : 1;
  });
  listArea.innerHTML = sortiert.map(function (v) {
    let linkHtml = '';
    if (v.link) {
      const sicher = /^https?:\/\//i.test(v.link) ? v.link : 'https://' + v.link;
      linkHtml = '<a class="v-link" href="' + escapeHtml(sicher) + '" target="_blank" rel="noopener noreferrer">' +
        '&#128279; ' + escapeHtml(v.link) + '</a>';
    }
    return '<div class="v-card">' +
      '<p class="v-titel">' + escapeHtml(v.titel) + '</p>' +
      '<div class="v-meta">von ' + escapeHtml(v.wer) + ' \u00b7 ' + escapeHtml(datumKurz(v.zeitstempel)) + '</div>' +
      (v.notizen ? '<div class="v-notizen">' + escapeHtml(v.notizen) + '</div>' : '') +
      linkHtml +
      (unlocked ? '<div class="v-actions"><button class="mini-btn danger del-btn" data-id="' +
        escapeHtml(v.id) + '">Entfernen</button></div>' : '') +
    '</div>';
  }).join('');
}

listArea.addEventListener('click', async function (ev) {
  const del = ev.target.closest('.del-btn');
  if (!del) return;
  if (!confirm('Diesen Vorschlag entfernen?')) return;
  try {
    await postToSheet({ action: 'suggestDelete', id: del.dataset.id });
    await new Promise(function (r) { setTimeout(r, 1300); });
    await laden(); render();
  } catch (e) { showError('Konnte nicht entfernt werden.'); }
});

toggleFormBtn.addEventListener('click', function () {
  if (!unlocked) { lockPanel.classList.add('open'); nameInput.focus(); return; }
  formCard.classList.toggle('open');
  if (formCard.classList.contains('open')) document.getElementById('fTitel').focus();
});
cancelBtn.addEventListener('click', function () {
  formCard.classList.remove('open');
  ['fTitel','fNotizen','fLink'].forEach(function (id) { document.getElementById(id).value = ''; });
});

saveBtn.addEventListener('click', async function () {
  if (!unlocked) { showError('Zuerst freischalten.'); return; }
  const titel = document.getElementById('fTitel').value.trim();
  if (!titel) { document.getElementById('fTitel').focus(); return; }
  const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
  saveBtn.disabled = true; saveBtn.textContent = 'Wird gespeichert \u2026';
  try {
    await postToSheet({
      action: 'suggest', id: id, titel: titel,
      notizen: document.getElementById('fNotizen').value.trim(),
      link: document.getElementById('fLink').value.trim()
    });
    showInfo('Gespeichert \u2013 Liste wird aktualisiert \u2026');
    await new Promise(function (r) { setTimeout(r, 1500); });
    await laden(); render();
    ['fTitel','fNotizen','fLink'].forEach(function (x) { document.getElementById(x).value = ''; });
    formCard.classList.remove('open');
    if (vorschlaege.some(function (v) { return String(v.id) === String(id); })) {
      showInfo('Vorschlag gespeichert.'); setTimeout(clearBanner, 2500);
    } else {
      showError('Der Vorschlag kam nicht an. M\u00f6gliche Ursachen: falsches Kennwort oder die Bereitstellung ist nicht auf &bdquo;Anyone&ldquo; gesetzt.');
    }
  } catch (e) {
    showError('Konnte nicht gespeichert werden: ' + escapeHtml(e.message));
  } finally {
    saveBtn.disabled = false; saveBtn.textContent = 'Speichern';
  }
});

// ---------- Kennwort ----------
function setUnlocked(state) {
  unlocked = state;
  if (state) {
    lockBtn.innerHTML = '\uD83D\uDD13 ' + escapeHtml(bearbeiterName) + ' \u2013 sperren';
    lockPanel.classList.remove('open');
    pwErr.textContent = '';
  } else {
    lockBtn.innerHTML = '\uD83D\uDD12 Freischalten';
    passwort = '';
    try { sessionStorage.removeItem('cakePw'); } catch (e) {}
    formCard.classList.remove('open');
  }
  render();
}

async function pruefeKennwort(pw) {
  const res = await fetch(APPS_SCRIPT_URL + '?pw=' + encodeURIComponent(pw));
  const data = await res.json();
  return data && data.ok === true;
}

lockBtn.addEventListener('click', function () {
  if (unlocked) { setUnlocked(false); return; }
  lockPanel.classList.toggle('open');
  if (lockPanel.classList.contains('open')) nameInput.focus();
});

async function versucheFreischalten() {
  const pw = pwInput.value, nm = nameInput.value.trim();
  if (!nm) { pwErr.textContent = 'Bitte zuerst deinen Namen eintragen.'; nameInput.focus(); return; }
  if (!pw) { pwInput.focus(); return; }
  pwSubmit.disabled = true; pwErr.textContent = '';
  try {
    if (await pruefeKennwort(pw)) {
      passwort = pw; bearbeiterName = nm; pwInput.value = '';
      try { sessionStorage.setItem('cakePw', pw); localStorage.setItem('cakeName', nm); } catch (e) {}
      setUnlocked(true);
    } else {
      pwErr.textContent = 'Das war nicht das richtige Kennwort.';
    }
  } catch (e) {
    pwErr.textContent = 'Kennwort konnte gerade nicht gepr\u00fcft werden.';
  } finally { pwSubmit.disabled = false; }
}
pwSubmit.addEventListener('click', versucheFreischalten);
pwInput.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') versucheFreischalten(); });

(async function init() {
  await laden();
  try {
    const nm = localStorage.getItem('cakeName');
    if (nm) { nameInput.value = nm; bearbeiterName = nm; }
    const pw = sessionStorage.getItem('cakePw');
    if (pw && bearbeiterName && await pruefeKennwort(pw)) { passwort = pw; unlocked = true; }
  } catch (e) {}
  setUnlocked(unlocked);
})();
</script>
</body>
</html>
